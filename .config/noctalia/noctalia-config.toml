[notification]
background_opacity = 0.99999997764825821
max_visible = 1
offset_x = 8
offset_y = 4
scale = 0.80000000447034836
show_app_name = false

[osd]
background_opacity = 0.99999997764825821
offset_x = 16
position = "bottom_center"
position_vertical = "top_left"

    [osd.kinds]
    keyboard_layout = false

[plugin_settings."noctalia/screen_recorder"]
glyph_idle = "player-record"
glyph_pending = "player-record-filled"
glyph_recording = "player-record-filled"
hide_inactive = true

[plugins]
enabled = [ "noctalia/umbriel-companion", "noctalia/screen_recorder" ]

[shell]
button_borders = false
card_borders = false
clipboard_history_max_entries = 64
corner_radius_scale = 0.0
font_family = "DepartureMono Nerd Font"
input_borders = false
polkit_agent = true
popup_borders = false

    [shell.animation]
    speed = 2.0000000298023224

    [shell.launcher]
    categories = false
    compact = true
    pinned = [ "md.obsidian.Obsidian" ]

        [shell.launcher.dmenu.entry.display-mode]
        command = "$HOME/.config/noctalia/scripts/display-mode list"
        exec = "$HOME/.config/noctalia/scripts/display-mode apply \"{selection}\""
        global = false
        glyph = "device-desktop"
        label = "Display mode"
        prefix = "disp"

        [shell.launcher.dmenu.entry.dns]
        command = "$HOME/.config/noctalia/scripts/dns list"
        exec = "$HOME/.config/noctalia/scripts/dns apply \"{selection}\""
        global = false
        glyph = "dns"
        label = "DNS"
        prefix = "dns"

        [shell.launcher.dmenu.entry.screen-record]
        command = "$HOME/.config/noctalia/scripts/screen-record list"
        exec = "$HOME/.config/noctalia/scripts/screen-record apply \"{selection}\""
        global = false
        glyph = "video"
        label = "Screen record"
        prefix = "rec"

        [shell.launcher.providers.session]
        global = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"

    [shell.session]
    grid = true
    grid_columns = 1
    show_shortcuts = false

    [shell.shadow]
    alpha = 0.4999999888241291

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Ayu"
community_palette = "Everforest Alt"
custom_palette = "Gruvbox-Material-Hard"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_community_templates = false

[wallpaper]
directory = "~/Pictures/Wallpapers"
transition = []

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/wallhaven-zmeqyg.jpg"

    [wallpaper.last]
    path = "~/Pictures/Wallpapers/wallhaven-zmeqyg.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "~/Pictures/Wallpapers/wallhaven-zmeqyg.jpg"

    [wallpaper.monitors.eDP-1]
    path = "~/Pictures/Wallpapers/wallhaven-zmeqyg.jpg"

[widget.bar]
enable_scroll = false
interactive = false
scale = 0.80000000000000004
scroll_cycles_layout = false
type = "noctalia/umbriel-companion:bar"

[widget.battery]
scale = 0.94999999999999996
show_label = false

[widget.bluetooth]
hide_when_adapter_off = true
scale = 0.85000000000000009

[widget.brightness]
scale = 0.80000000000000004
show_label = false

[widget.clock]
anchor = true
format = "{:%a %d - %H:%M}"
scale = 0.90000000000000013
tooltip_format = "{:%Y/%m/%d - %H:%M:%S}"

[widget.network]
scale = 0.85000000000000009
show_label = false

[widget.notifications]
hide_when_no_unread = true
scale = 0.75

[widget.recorder]
scale = 0.69999999999999996
type = "noctalia/screen_recorder:recorder"

[widget.session]
scale = 0.85000000000000009

[widget.sysmon]
stat = "ram_pct"
visualization = "none"

[widget.tray]
drawer = true
drawer_columns = 4
drawer_item_size = 20.0
match_adjacent_spacing = true
scale = 0.90000000000000013

[widget.volume]
scale = 0.80000000000000004
show_label = false

[widget.weather]
enabled = false
scale = 0.80000000000000004
show_condition = false
show_temperature = false

[widget.workspaces]
active_pill_size = 3.2000000000000002
focused_output_only = true
occupied_color = "on_surface_variant"
pill_scale = 0.40000000000000002
scale = 0.90000000000000013
style = "minimal"
