[audio]
enable_overdrive = true
enable_sounds = true

[bar.default]
capsule = true
capsule_opacity = 0.0
capsule_padding = 2.0
capsule_radius = 0
capsule_thickness = 0.79999998584389687
center = [ "weather", "clock", "recorder" ]
concave_edge_corners = false
end = [ "tray", "notifications", "bluetooth", "network", "volume", "brightness", "battery", "session" ]
font_weight = 700
margin_ends = 0
padding = 8
radius = 0
shadow = false
start = [ "bar", "workspaces" ]
thickness = 16
widget_spacing = 4

    [bar.default.dead_zone.actions]
    scroll_down = "workspace-switch next"
    scroll_up = "workspace-switch prev"

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false

[hooks]
battery_charging = "noctalia msg power-set balanced"
battery_discharging = "noctalia msg power-set power-saver"
battery_plugged = "noctalia msg power-set balanced"
started = "if [ \"$(cat /sys/class/power_supply/AC/online)\" -eq 1 ]; then noctalia msg power-set balanced; else noctalia msg power-set power-saver; fi"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]

[lockscreen]
blur_intensity = 0.39999999105930328
tint_intensity = 0.19999999552965164
transition = []
transition_duration = 100

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@WL-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004"
