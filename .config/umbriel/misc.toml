[general]
autostart = [
  "noctalia",
  "fcitx5 -d --replace",
  "systemctl --user start 9router.service",
]
mod_key = "Super"
xwayland = true
xwayland_primary_output = "Acer Technologies EK241Y E 1432072153W01"
show_cheatsheet = false

[events]
lid_close = """if umbriel outputs --json | jq -e 'any(.[]; .enabled == true and .name != "eDP-1")' >/dev/null; then umbriel msg output-disable eDP-1; fi"""
lid_open = "umbriel msg output-enable eDP-1"

[environment]
GTK_IM_MODULE="fcitx"
QT_IM_MODULE="fcitx"
QT_IM_MODULES="wayland;fcitx;ibus"
XMODIFIERS="@im=fcitx"
SDL_IM_MODULE="fcitx"
GLFW_IM_MODULE="ibus"
QT_QPA_PLATFORMTHEME="qt6ct"
_JAVA_AWT_WM_NONREPARENTING="1"
